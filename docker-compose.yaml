services:
  proxy:
    build:
      context: .
      target: sdk-runtime
    image: openai-proxy:latest
    ports:
      - "127.0.0.1:${PORT:-8181}:8181"
    environment:
      CODEX_HOME: /home/oproxy/.codex
      PROXY_CONSOLE_ORIGIN: ${PROXY_CONSOLE_ORIGIN:-http://localhost:8181}
      PROXY_CONSOLE_WORKSPACE: /home/oproxy/workspace
      CODEX_WIRE_API: ${CODEX_WIRE_API:-responses}
      RUST_LOG: ${RUST_LOG:-openai_proxy=info}
    volumes:
      # A directory mount observes atomic login replacement and supports managed renewal.
      # Set OPROXY_CODEX_HOME to a dedicated private directory owned by the container user.
      - "${OPROXY_CODEX_HOME:-oproxy-codex}:/home/oproxy/.codex"
      - "${OPROXY_CONFIG_DIR:-oproxy-config}:/home/oproxy/.config/oproxy"
      - oproxy-data:/home/oproxy/.local/share/oproxy
      - oproxy-workspace:/home/oproxy/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  oproxy-codex:
  oproxy-config:
  oproxy-data:
  oproxy-workspace:
